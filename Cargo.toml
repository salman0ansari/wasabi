[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/core",
    "crates/repository",
    "crates/whatsapp",
    "crates/media",
    "crates/test-support",
]
# The GPUI application is an isolated nested workspace so its dependency tree
# and committed lockfile pin do not infect core builds.
exclude = ["apps/desktop"]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
wasabi-domain = { path = "crates/domain" }
wasabi-core = { path = "crates/core" }
wasabi-repository = { path = "crates/repository" }
wasabi-whatsapp = { path = "crates/whatsapp" }
wasabi-media = { path = "crates/media" }
wasabi-test-support = { path = "crates/test-support" }

whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", default-features = false }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", default-features = false }
whatsapp-rust-chat-store = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", features = ["search"] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915" }

anyhow = "1.0"
thiserror = "2"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
chrono = { version = "0.4", default-features = false, features = ["now", "serde"] }
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
dirs = "6"
diesel = { version = "2.3.12", features = ["sqlite"] }

# dev
tempfile = "3"
proptest = "1"
