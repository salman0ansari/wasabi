[package]
name = "wasabi-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
wasabi-domain = { workspace = true }
whatsapp-rust = { workspace = true, features = [
    "sqlite-storage",
    "tokio-transport",
    "ureq-client",
    "signal",
    "tracing",
    "metrics",
] }
whatsapp-rust-chat-store = { workspace = true }
whatsapp-rust-sqlite-storage = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
diesel = { workspace = true }
wacore = { workspace = true }
serde_json = "1"

[dev-dependencies]
wasabi-test-support = { workspace = true }
tempfile = { workspace = true }
waproto = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros", "sync"] }

[lints.rust]
unsafe_code = "forbid"
