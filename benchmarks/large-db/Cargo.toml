# Standalone workspace: this bench deliberately lives outside the main
# wasabi workspace so a 1M-row fixture run never shares its lockfile or
# target dir with product builds.
[workspace]

[package]
name = "large-db-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wasabi-repository = { path = "../../crates/repository" }
wasabi-domain = { path = "../../crates/domain" }

whatsapp-rust-chat-store = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", features = [
    "search",
] }
whatsapp-rust-sqlite-storage = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915" }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", default-features = false }
# Jid construction for fixtures; wacore does not re-export it.
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", default-features = false }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915" }

# Only for PRAGMA probes through shared_db(); pinned to the same 2.3 series
# the upstream tree uses so both resolve to one diesel build.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = "0.4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"
