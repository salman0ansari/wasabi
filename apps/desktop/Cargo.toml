[workspace]
# isolated nested workspace: gpui tree stays out of core builds

[package]
name = "wasabi-desktop"
version = "0.2.0-alpha.2"
edition = "2024"

[dependencies]
wasabi-domain = { path = "../../crates/domain" }
wasabi-core = { path = "../../crates/core" }
wasabi-repository = { path = "../../crates/repository" }
wasabi-whatsapp = { path = "../../crates/whatsapp" }
wasabi-media = { path = "../../crates/media" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", default-features = false, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "signal",
] }
whatsapp-rust-chat-store = { git = "https://github.com/oxidezap/whatsapp-rust.git", rev = "1489b7da9a6a7e3cadc4337ee46399da7de25915", features = ["search"] }
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "0775df394083c1ed74f36f846b78868d1267398f" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "0775df394083c1ed74f36f846b78868d1267398f" }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread","sync","time","macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
chrono = "0.4"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4.18.0"

[dev-dependencies]
tempfile = "3"

[profile.dev.package.gpui]
opt-level = 3

# Release artifacts should not ship compiler symbol tables. This keeps the
# standalone native executable materially smaller without changing runtime
# behavior or relying on a packaging step that can be forgotten.
[profile.release]
strip = "symbols"
